# EvaTerm Configuration File
# Location: ~/.config/evaterm/config.ini

# Color scheme theme name:
# Options: crimson_flame, catppuccin_mocha, tokyo_night, dracula, nord, gruvbox_dark
theme = crimson_flame

# Font configuration
font_family = monospace
font_size = 12

# Shell path (leave empty for auto-detect $SHELL)
shell = 

# Terminal behaviour
scrollback_limit = 10000
cursor_shape = block
cursor_blink = true
padding_x = 8
padding_y = 6
background_opacity = 1.0
show_tab_bar_single_tab = true
